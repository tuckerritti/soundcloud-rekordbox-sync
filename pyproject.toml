[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sc2rb"
version = "0.1.0"
description = "Sync SoundCloud playlists to Rekordbox"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer[all]>=0.9.0",
    "httpx>=0.25.0",
    "mutagen>=1.47.0",
    "yt-dlp>=2024.1.0",
    "pydantic>=2.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
]

[project.scripts]
sc2rb = "sc2rb.cli:app"

[tool.setuptools.packages.find]
where = ["."]
